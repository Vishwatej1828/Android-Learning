name: Android CI

on:
  push:
    branches: [ "my-master" ]
  pull_request:
    branches: [ "my-master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Find Android apps
        id: find_apps
        run: |
          echo "APPS=$(find . -mindepth 1 -maxdepth 1 -type d -exec test -f {}/gradlew -a -f {}/app/build.gradle \; -print | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_ENV

      - name: Build each app
        run: |
          for app in $(echo $APPS | jq -r '.[]'); do
            echo "Building $app..."
            chmod +x $app/gradlew
            (cd $app && ./gradlew build)
          done
